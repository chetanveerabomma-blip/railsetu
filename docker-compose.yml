version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: railsetu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: railsetu
      MYSQL_USER: railsetu
      MYSQL_PASSWORD: railsetu123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  railsetu-app:
    build: .
    container_name: railsetu-app
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/railsetu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: railsetu
      SPRING_DATASOURCE_PASSWORD: railsetu123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  mysql_data:
