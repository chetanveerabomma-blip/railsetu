server.port=8080
spring.application.name=railsetu-operations

# Dual Database Support: Default Profile uses In-Memory H2 in Full MySQL Dialect Mode
spring.datasource.url=jdbc:h2:mem:railsetudb;MODE=MySQL;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=railsetu
spring.datasource.password=railsetu_secret

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable auto-running schema.sql on H2 (schema.sql is provided for external MySQL deployment)
spring.sql.init.mode=never

# H2 Console for Inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & JWT Configuration
railsetu.jwt.secret=RailSetuSuperSecretKeyForSigningJwtTokensRailwaysOperations2026SecureKey!
railsetu.jwt.expiration-ms=86400000

# Concurrency & Seat Locking Configuration
railsetu.inventory.seat-hold-timeout-minutes=10
railsetu.simulation.academic-dynamic-pricing-enabled=true

# Logging
logging.level.com.railsetu=INFO
logging.level.org.springframework.security=WARN
